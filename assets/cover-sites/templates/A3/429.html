<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#131719" data-variant="{{VARIANT_NONCE}}">
  <meta name="description" content="Too many requests. Please try again later.">
  <title>Too Many Requests | {{BRAND}}</title>
  <style>
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #131719; color: #f0f0ee; font: 1rem/1.75 system-ui, "Segoe UI", sans-serif; }
    main { box-sizing: border-box; width: min(39rem, calc(100% - 2rem)); padding: clamp(1.25rem, 6vw, 2.8rem); border: 1px solid #353a3c; border-top: 3px solid {{ACCENT}}; background: #1d2325; }
    .brand, .code { font: 600 .85rem/1.4 ui-monospace, Consolas, monospace; }
    .brand { color: {{ACCENT}}; }
    .code { color: #bbc3bc; }
    h1 { margin: .6rem 0; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; }
    a { display: inline-block; padding: .4rem .75rem; border: 1px solid {{ACCENT}}; color: {{ACCENT}}; text-underline-offset: .25em; }
  </style>
</head>
<body>
  <main>
    <p class="brand">{{BRAND}}</p>
    <p class="code" aria-hidden="true">429</p>
    <h1>Too Many Requests</h1>
    <p>Please try again later.</p>
    <a href="/">Return to reference →</a>
  </main>
</body>
</html>
