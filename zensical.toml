[project]
site_name = "3X-UI AUTO NGINX"
site_description = "Установка 3x-ui и Xray на свой VPS, настройка подключений и управление сервером"
site_url = "https://xpromsx.github.io/3x-ui-auto-nginx/"
site_author = "xPROMSx contributors"
repo_url = "https://github.com/xPROMSx/3x-ui-auto-nginx"
repo_name = "GitHub"
copyright = "© xPROMSx · github.com/xPROMSx/3x-ui-auto-nginx"
docs_dir = "docs-site"
site_dir = "site"
nav = [
  { "Главная" = "index.md" },
  { "Начало работы" = "start.md" },
  { "Инструкции" = "guides/index.md" },
]

[project.theme]
language = "ru"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Включить светлую тему"

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
