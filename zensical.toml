[project]
site_name = "3X-UI AUTO NGINX"
site_description = "Установка 3x-ui и Xray на свой VPS, настройка подключений и управление сервером"
site_url = "https://xpromsx.github.io/3x-ui-auto-nginx/"
site_author = "xPROMSx contributors"
repo_url = "https://github.com/xPROMSx/3x-ui-auto-nginx"
repo_name = "GitHub"
copyright = '© xPROMSx · github.com/xPROMSx/3x-ui-auto-nginx · <a href="https://xpromsx.github.io/3x-ui-auto-nginx/terms/">Условия использования материалов</a>'
docs_dir = "docs-site"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Главная" = "index.md" },
  { "Первый запуск" = "start.md" },
  { "Поддержать проект" = "support/index.md" },
  { "Инструкции" = [
    { "Все инструкции" = "guides/index.md" },
    # Остальные пункты в русском алфавитном порядке.
    { "Балансировщик и резервный VPS" = "guides/balancer.md" },
    { "Безопасность VPS" = "guides/security.md" },
    { "Импорт VLESS REALITY" = "guides/import-reality.md" },
    { "Каскад из двух VPS" = "guides/cascade.md" },
    { "Ключи SSH" = "guides/ssh-keys.md" },
    { "Личный DNS" = "guides/dns.md" },
    { "Маршрутизация трафика" = "guides/routing.md" },
    { "Отключение входа по паролю SSH" = "guides/ssh-password.md" },
    { "Подключения и nginx" = "guides/connections.md" },
    { "Резервные копии и клиенты" = "guides/backup.md" },
    { "Смена доменов" = "guides/domains.md" },
    { "Телеграм: собственный WEB-прокси" = "guides/telegram-web-proxy.md" },
    { "Условия использования материалов" = "terms.md" },
  ] },
]

[project.theme]
language = "ru"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "navigation.path",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Включить светлую тему"

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
