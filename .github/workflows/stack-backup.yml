name: 3x-ui Auto Nginx Backup and restore validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Stack Backup and restore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx certbot sqlite3 openssl curl python3 python3-configobj python3-cryptography tar gzip
      - name: Test completeness
        run: python3 tests/run_ci.py --check-completeness
      - name: Backup and restore regression tests
        env:
          NGINX_BIN: /usr/sbin/nginx
        run: sudo --preserve-env=NGINX_BIN python3 tests/run_ci.py --suite root
      - name: Whitespace validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          git show --format= --check HEAD
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          fi
