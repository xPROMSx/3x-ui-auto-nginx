name: Telegram release announcements

'on':
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify @promsdev
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish release or test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RELEASE_PROJECT: 3X-UI AUTO NGINX
          RELEASE_EMOJI: 🚀
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def release_highlight(body):
              in_russian_section = False
              paragraph = []
              for line in body.splitlines():
                  line = line.strip()
                  if not in_russian_section:
                      in_russian_section = line == "## 🇷🇺 Что нового"
                      continue
                  if re.match(r"^#{1,2}(?:\s|$)", line):
                      break
                  if paragraph:
                      if not line or re.match(
                          r"^(?:#{1,6}(?:\s|$)|(?:[-+*]|\d{1,9}[.)])\s+|(?:-{3,}|\*{3,}|_{3,})$)", line
                      ):
                          break
                      paragraph.append(line)
                  elif line.startswith("**Главное в релизе:**"):
                      paragraph.append(line.removeprefix("**Главное в релизе:**").lstrip())
              return "\n".join(paragraph).strip()

          def telegram_html(text):
              inline = re.compile(
                  r"`([^`\n]+)`|\[([^\]\n]+)\]\((https?://[^\s)]+)\)"
                  r"|(\*\*|(?<!\w)__|~~|\*|(?<!\w)_)(?=\S)(.+?)(?<=\S)\4"
              )
              tags = {"**": "b", "__": "b", "*": "i", "_": "i", "~~": "s"}
              parts = []
              end = 0
              for match in inline.finditer(text):
                  parts.append(html.escape(text[end:match.start()]))
                  code, label, url, delimiter, styled = match.groups()
                  if code is not None:
                      parts.append(f"<code>{html.escape(code)}</code>")
                  elif url is not None:
                      parts.append(f'<a href="{html.escape(url, quote=True)}">{html.escape(label)}</a>')
                  else:
                      tag = tags[delimiter]
                      parts.append(f"<{tag}>{html.escape(styled)}</{tag}>")
                  end = match.end()
              return "".join(parts) + html.escape(text[end:])

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              sys.exit("Missing TELEGRAM_BOT_TOKEN repository secret")

          name = os.environ["RELEASE_PROJECT"]
          emoji = os.environ["RELEASE_EMOJI"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              message = (
                  "🧪 <b>Проверка уведомлений / Release bot test</b>\n\n"
                  f"{html.escape(emoji + ' ' + name)}\n"
                  "GitHub Actions → Telegram: тестовое сообщение."
              )
          else:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
                  release = json.load(file)["release"]
              if release.get("draft") or release.get("prerelease"):
                  sys.exit("Not a stable published release")
              version = str(release["tag_name"])[:80]
              url = release["html_url"]
              expected = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/releases/"
              if not url.startswith(expected):
                  sys.exit("Unexpected release URL")
              highlight = release_highlight(release.get("body") or "")
              description = "Релиз доступен на GitHub."
              if highlight:
                  description = "✨ <b>Главное в релизе</b>\n" + telegram_html(highlight)
              message = (
                  f"{emoji} <b>{html.escape(name)} · {html.escape(version)}</b>\n\n"
                  f"{description}\n\n"
                  f'<a href="{html.escape(url, quote=True)}">📦 Описание и загрузка</a>'
              )

          payload = json.dumps({
              "chat_id": "@promsdev",
              "text": message,
              "parse_mode": "HTML",
              "link_preview_options": {"is_disabled": True},
          }, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  answer = json.load(response)
          except urllib.error.HTTPError as error:
              sys.exit(f"Telegram API HTTP {error.code}: check token and channel posting permission")
          except urllib.error.URLError:
              sys.exit("Telegram API network error")
          if not answer.get("ok"):
              sys.exit("Telegram API did not confirm sending")
          print("Telegram channel message sent")
          PY
