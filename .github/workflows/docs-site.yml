name: Documentation website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Zensical documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Zensical
        run: python -m pip install zensical==0.1.3
      - name: Build and check documentation
        run: zensical build --strict --clean
      - name: Check whether Pages publishing is enabled
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
        run: echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.publish == 'true'
        with:
          path: site

  deploy:
    name: Deploy documentation to GitHub Pages
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: docs-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
