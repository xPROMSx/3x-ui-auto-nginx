name: 3x-ui Auto Nginx real service integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    name: Real services (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install explicit service test dependencies
        run: |
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends nginx certbot sqlite3 openssl curl python3 python3-configobj python3-cryptography apache2-utils iproute2 tar gzip sudo
      - name: Canonical completeness
        run: python3 tests/run_ci.py --check-completeness
      - name: Real AGH, HTTP-01 renewal and private Restore
        env:
          NGINX_BIN: /usr/sbin/nginx
        run: python3 tests/run_ci.py --suite services
      - name: Real embedded AmneziaWG TCP/UDP and restart
        env:
          NGINX_BIN: /usr/sbin/nginx
          PYTHONPATH: tests
        run: python3 -m unittest -v test_real_integration.RealIntegration.test_amneziawg_tcp_udp_and_panel_restart
